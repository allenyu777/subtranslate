<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生词本 · SubTranslate</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="vocab.css" />
</head>
<body>
  <header>
    <h1>📒 生词本</h1>
    <span id="stats" class="muted"></span>
    <span class="grow"></span>
    <button id="export-csv" title="导出为 CSV，可直接导入 Anki">导出 CSV</button>
    <button id="export-json" title="完整备份">备份 JSON</button>
    <button id="import-json">导入备份</button>
    <input id="import-file" type="file" accept="application/json" hidden />
  </header>
  <div class="filters">
    <input id="search" type="search" placeholder="搜索单词、例句…" />
    <select id="status">
      <option value="learning">学习中</option>
      <option value="mastered">已掌握</option>
      <option value="all">全部</option>
    </select>
    <select id="sort">
      <option value="recent">最近添加</option>
      <option value="alpha">按字母</option>
      <option value="examples">例句最多</option>
    </select>
  </div>
  <main id="list"></main>
  <script src="vocab.js"></script>
</body>
</html>
